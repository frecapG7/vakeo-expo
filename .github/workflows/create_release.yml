name: Vakeo App Production Release

on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      new-version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        env:
          VERSION_BUMP: ${{ github.event.inputs.version-bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version $VERSION_BUMP -m "Release v%s"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          git push
          git push --tags

  build-android:
    needs: version-bump
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-bump.outputs.new-version }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Cache Gradle (~/.gradle) entre les runs - le build RN est tres lourd,
      # c'est le levier no 1 sur le temps de build.
      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # v4: ne demande plus le paquet legacy 'tools', retire du depot SDK
      # Google en sept 2026 (setup-android#537, fix depuis v4.0.2).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # AAB release minifie (R8 + shrink via app.config.js) - c'est ce qui
      # remonte le score d'optimisation de la Play Console.
      - name: Build Android
        run: eas build --platform android --non-interactive --profile production --local --output app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: vakeo-android-${{ needs.version-bump.outputs.new-version }}
          path: app-release.aab
          retention-days: 14

      - name: Submit to Google Play
        run: |
          echo '${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}' > service-account.json
          eas submit --platform android --path app-release.aab --non-interactive --profile production

  build-ios:
    needs: version-bump
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version-bump.outputs.new-version }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS
        run: eas build --platform ios --non-interactive --profile production --local --output app-release.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: vakeo-ios-${{ needs.version-bump.outputs.new-version }}
          path: app-release.ipa
          retention-days: 14

      - name: Submit to App Store
        run: |
          echo '${{ secrets.APP_STORE_CONNECT_API_KEY }}' > asc-api-key.json
          eas submit --platform ios --path app-release.ipa --non-interactive --profile production
